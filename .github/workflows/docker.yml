name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  # weekly rebuild of the latest release to pick up base image (PHP) security fixes
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # scheduled runs rebuild the latest release tag, so :latest gets the fresh base image
      - name: Check out latest release tag
        id: release
        if: github.event_name == 'schedule'
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git checkout "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/teqneers/phpknock
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}

      - uses: docker/bake-action@v7
        with:
          files: docker/docker-bake.hcl
          targets: default
          push: true
          pull: true
          set: |
            default.tags=${{ steps.meta.outputs.tags }}
